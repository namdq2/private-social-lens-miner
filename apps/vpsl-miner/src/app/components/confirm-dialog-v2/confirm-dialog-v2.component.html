<div class="p-6 max-w-md">
  <div class="flex flex-row justify-start items-center gap-x-2 text-base font-semibold mb-4">
    <mat-icon class="text-gray-400">{{data.icon || 'warning'}}</mat-icon>
    <h2 class="text-xl font-semibold text-white">{{data.title}}</h2>
  </div>
  
  <p class="text-gray-400 mb-6">{{data.message}}</p>
  
  <div class="flex justify-end gap-x-3">
    <button 
      class="dfus-basic-btn"
      (click)="onCancel()">
      Cancel
    </button>
    <button 
      [class]="data.confirmButtonClass || 'dfus-orange-btn'"
      (click)="onConfirm()">
      {{data.confirmText || 'Confirm'}}
    </button>
  </div>
</div>
