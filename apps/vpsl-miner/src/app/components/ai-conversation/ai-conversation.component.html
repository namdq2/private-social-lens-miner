<div
  class="conversation-item p-3 rounded-lg transition-colors duration-200 border"
  [class.cursor-pointer]="!disabled"
  [class.cursor-not-allowed]="disabled"
  [class.bg-[#2a2d33]]="isSelected"
  [class.border-[#4488f6]]="isSelected"
  [class.bg-[#1a1d23]]="!isSelected"
  [class.border-[#22252B]]="!isSelected"
  [class.hover:bg-[#25282e]]="!isSelected && !disabled"
  [class.selected]="isSelected"
  (click)="!disabled && onSelect()"
>
  <div class="flex justify-between items-start conversation-content">
    <div class="flex-1 min-w-0 mr-2">
      <!-- Conversation title -->
      <h4 class="text-sm font-medium text-white truncate mb-1 conversation-title">
        {{ conversation.title }}
      </h4>

      <!-- Last message preview -->
      <p class="text-xs text-gray-400 truncate">
        {{ getLastMessagePreview() }}
      </p>

      <!-- Date -->
      <span class="text-xs text-gray-500 mt-1 block">
        {{ formatDate(conversation.updatedAt) }}
      </span>
    </div>

    <!-- Delete button -->
    <button
      class="delete-btn group transition-all duration-200 rounded-lg p-1 h-8"
      [class.cursor-pointer]="!disabled && !isDeleting"
      [class.cursor-not-allowed]="disabled || isDeleting"
      [class.hover:bg-red-600]="!disabled && !isDeleting"
      (click)="!disabled && !isDeleting && openConfirmDialog()"
      [attr.aria-label]="'Delete conversation: ' + conversation.title"
      [disabled]="disabled || isDeleting"
    >
      @if (isDeleting) {
      <mat-icon class="text-gray-400 text-sm transition-colors !flex items-center justify-center animate-spin">hourglass_empty</mat-icon>
      } @else {
      <mat-icon class="text-gray-400 text-sm transition-colors !flex items-center justify-center" [class.group-hover:text-red-500]="!disabled">delete</mat-icon>
      }
    </button>
  </div>
</div>
